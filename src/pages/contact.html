<section class="section join" id="join" aria-labelledby="join-title"><div class="shell"><div class="section-meta mono"><span>CONTACT / LAB</span><span>交流、加入与项目协作</span></div><div class="join-panel">
      <div class="join-copy"><h1 id="join-title">联系实验室</h1><p>项目交流、资料更新与加入咨询，均可通过以下方式联系。</p><div class="contact-block"><span class="contact-label">联系人：{{person}}</span><div class="phone-row"><a class="phone" href="tel:{{phone}}">{{phone}}</a><button class="copy-button" type="button" hidden>复制号码 ↗</button></div><span class="contact-hint">点击号码拨打 · 也可以选中号码复制</span><p class="copy-feedback" aria-live="polite" role="status"></p></div></div>
      <div class="qr-card"><div class="qr-title"><span class="qr-dot" aria-hidden="true"></span>微信扫码加入社团群</div><div class="qr-active"><a class="qr-image-link" href="{{qrImage}}" target="_blank" rel="noopener" aria-label="查看完整微信群二维码"><img src="{{qrImage}}" width="256" height="256" alt="{{name}}微信群二维码，{{qrValidityLabel}}" loading="lazy"></a><div class="qr-links"><a href="{{qrImage}}" target="_blank" rel="noopener">查看大图 ↗</a><a href="{{qrImage}}" download="{{name}}-微信群二维码.png">保存二维码 ↓</a></div></div><div class="qr-expired" hidden><span aria-hidden="true">↻</span><h3>二维码已过期</h3><p>请联系{{person}}获取最新入群方式。</p><a class="button button-primary" href="tel:{{phone}}">联系{{person}} ↗</a></div><p class="qr-validity">{{qrValidityLabel}}<span>若无法入群，请通过电话联系我们。</span></p></div>
    </div></div></section>
