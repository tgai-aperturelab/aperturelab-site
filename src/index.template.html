<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070707">
  <title>{{name}} · 项目、成员与协作</title>
  <meta name="description" content="{{name}}官方网站。一起探索软件开发、人工智能、机器人与网络技术，把好奇变成行动，把想法做成作品。不限专业，欢迎不同基础的同学。">
  <link rel="canonical" href="{{url}}/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:title" content="{{name}} · 项目、成员与协作">
  <meta property="og:description" content="探索技术、认识伙伴、参与协作。光圈科技实验室，和你一起把想法做成作品。">
  <meta property="og:url" content="{{url}}/">
  <meta property="og:image" content="{{url}}/assets/aperture-social.webp">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="黑色背景上的白色八叶光圈">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20261011-transparent">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=20261011-transparent">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/styles.css?v=multipage-v5-20261011">
  <link rel="stylesheet" href="/assets/portal.css?v=multipage-v5-20261011">
  <script type="module" src="/assets/site.js?v=multipage-v5-20261011"></script>
</head>
<body class="portal">
  <a class="skip-link" href="#main">跳到正文</a>
  {{header}}
  <main id="main">
    <section class="lab-home" id="top" aria-labelledby="hero-title"><div class="shell">
      <div class="lab-home-grid"><div class="lab-home-copy"><p class="eyebrow mono">APERTURE LAB / EXPLORE · BUILD · SHARE</p><h1 id="hero-title">光圈科技<br><span class="outline-word">实验室</span><span class="period">。</span></h1><p class="lab-intro">以项目连接兴趣，以协作积累经验。<br>探索软件、人工智能、机器人与网络系统。</p><div class="hero-actions"><a class="button button-primary" href="/projects/">浏览项目 <span aria-hidden="true">↗</span></a><a class="text-link" href="/docs/">开发文档 <span aria-hidden="true">↗</span></a></div><a class="lab-about-link" href="/about/">了解实验室的探索方向 ↓</a></div>
                <div class="aperture-stage">
            <div class="stage-label mono"><span>APERTURE / 08</span><span class="aperture-state" aria-hidden="true">OPEN</span></div>
            <div class="aperture-orbit">
              <span class="orbit-notch notch-n" aria-hidden="true"></span><span class="orbit-notch notch-e" aria-hidden="true"></span><span class="orbit-notch notch-s" aria-hidden="true"></span><span class="orbit-notch notch-w" aria-hidden="true"></span>
              <button class="aperture-control" type="button" aria-label="开合光圈" aria-pressed="false" aria-describedby="aperture-hint">
                <span class="aperture-core" aria-hidden="true"><span class="core-cross"></span><span class="mono">MAKE<br>IT REAL.</span></span>
                {{aperture}}
              </button>
            </div>
            <p class="aperture-hint mono" id="aperture-hint"><span class="desktop-hint">HOVER TO FOCUS</span><span class="touch-hint">TAP TO FOCUS</span><span aria-hidden="true">↗</span></p>
          </div>
      </div>
      <nav class="entry-grid" aria-label="实验室内容入口"><a href="/projects/"><span class="mono">01 / PROJECTS</span><strong>项目目录</strong><span>浏览公开项目与维护入口 ↗</span></a><a href="/members/"><span class="mono">02 / PEOPLE</span><strong>成员墙</strong><span>认识一起动手的伙伴 ↗</span></a><a href="/resources/"><span class="mono">03 / RESOURCES</span><strong>资料与文档</strong><span>查阅规范，获取协作模板 ↗</span></a></nav>
    </div></section>
  </main>
  {{footer}}
</body>
</html>
